[project]
name = "datafest-conversion"
version = "0.1.0"
description = "Datafest: prediccion de propension de conversion (Gini)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "optuna",
    "shap",
    "matplotlib",
    "seaborn",
    "ipykernel",
    "jupyter",
]

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 100
